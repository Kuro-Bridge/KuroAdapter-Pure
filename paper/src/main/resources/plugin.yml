# KuroBridgePure 插件清单（经典 plugin.yml，对齐主仓 ADR-038 universal 基线）
# 经典格式从 1.12.2 到 26.3 全版本可加载；paper-plugin.yml 是 1.19.4+ 专属格式，旧服不可见。
# 命令在本文件声明（kurobridge），执行体 KurobridgeCommand 经主类 onEnable 挂为 Executor。
name: KuroBridgePure
version: '1.0.0'
main: com.kurobridge.pure.KuroBridgePurePlugin
# api-version 下限标记：1.13+ 服务器读取；1.12.2 忽略未知键（该键 1.13 才引入）
api-version: '1.13'
# 加载时机：服务端启动时（拉起 WS 服务端并注册监听器）
load: STARTUP

commands:
    kurobridge:
        description: KuroBridge 互通桥管理
        usage: /kurobridge reload
        permission: kurobridge.reload

permissions:
    kurobridge.relay:
        description: 消息互通权限（聊天转发）
        default: true
    kurobridge.reload:
        description: 重载 KuroBridgePure 配置（/kurobridge reload）
        default: op
